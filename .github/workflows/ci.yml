# CI for LocalSight: the browser-engine unit tests, backend API, ML edge pipeline,
# frontend build, the browser smoke test of the static build, and the GitHub Pages
# subpath (base) check.
#
# The six jobs are independent on purpose: a red backend does not cancel or hide
# the unit, ML, frontend, e2e and pages-base results.
#
# Model-dependent tests skip on their own when the weights or demo clips are
# missing (see ml/tests/test_privacy.py: `skipif(not MODEL.is_file())` and
# `pytest.skip("demo clip not available")`). CI never runs fetch_all.sh, so the
# YOLO/NCNN weights and `data/videos/*.mp4` are absent and those cases are
# reported as skipped, not failed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

  ml:
    name: ml / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      # ultralytics is imported lazily, but the pipeline's tracking and NCNN
      # backends both rely on it, so CI installs the extra instead of testing a
      # half-populated environment. It pulls torch (~1 GB): the uv cache keeps
      # repeat runs cheap, and the tests that need real weights still skip.
      - name: Sync dependencies (with the yolo extra)
        run: uv sync --extra yolo

      - name: Run tests
        run: uv run pytest -q

  unit:
    name: frontend / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pure logic only: the engine, the event contract helpers and the report/confidence
      # formatters, plus the demo fixtures and the API transport mappers.
      - name: Unit tests
        run: npm run test:unit

  frontend:
    name: frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: frontend / e2e smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only Chromium is used by playwright.config.js; --with-deps installs the
      # system libraries the runner image does not ship with.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite builds the mock app (VITE_USE_MOCK=true) and serves the real
      # dist with `vite preview`, so what is tested is what Pages would deploy.
      - name: Run e2e smoke tests
        run: npm run test:e2e

  pages-base:
    name: frontend / Pages base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build exactly like pages.yml (mock mode, served under /LocalSight/), then
      # mirror its SPA fallback so the check sees the artifact Pages would deploy.
      - name: Build under the deploy base
        run: npm run build
        env:
          VITE_USE_MOCK: "true"
          VITE_BASE: "/LocalSight/"

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Fails if an internal src/href ignores VITE_BASE, if 404.html drifts from
      # index.html, or if the browser models are not published.
      - name: Verify the base subpath
        run: node scripts/check-base.mjs
