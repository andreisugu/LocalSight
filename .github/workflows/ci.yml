# CI for LocalSight: the browser-engine logic, the static frontend build, the
# browser smoke test of that build, and the GitHub Pages subpath (base) check.
#
# The four jobs are independent on purpose: a red frontend build does not cancel
# or hide the unit, e2e and pages-base results.
#
# There is no Python job: the SafeSight reference stack (backend/, ml/,
# automation/) was removed from this fork. The product is the static app in
# frontend/, and nothing in it is executed by Python. The old pytest suites stay
# in git history and in the upstream repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: frontend / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pure logic only: the engine, the event contract helpers and the report/confidence
      # formatters, plus the demo fixtures and the API transport mappers.
      - name: Unit tests
        run: npm run test:unit

  frontend:
    name: frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: frontend / e2e smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only Chromium is used by playwright.config.js; --with-deps installs the
      # system libraries the runner image does not ship with.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite builds the mock app (VITE_USE_MOCK=true) and serves the real
      # dist with `vite preview`, so what is tested is what Pages would deploy.
      - name: Run e2e smoke tests
        run: npm run test:e2e

  pages-base:
    name: frontend / Pages base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build exactly like pages.yml (mock mode, served under /LocalSight/), then
      # mirror its SPA fallback so the check sees the artifact Pages would deploy.
      - name: Build under the deploy base
        run: npm run build
        env:
          VITE_USE_MOCK: "true"
          VITE_BASE: "/LocalSight/"

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Fails if an internal src/href ignores VITE_BASE, if 404.html drifts from
      # index.html, or if the browser models are not published.
      - name: Verify the base subpath
        run: node scripts/check-base.mjs
