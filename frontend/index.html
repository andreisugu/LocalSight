<!doctype html>
<!-- LocalSight shell. A static host (GitHub Pages) cannot send response headers, so the
     document carries its own policy: what a header would enforce, these meta tags enforce. -->
<html lang="ro" data-app="localsight">
  <head><meta charset="utf-8" />
    <!-- This policy must stay ahead of every script: a meta policy covers only what follows.

         - script-src: our own modules only. 'wasm-unsafe-eval' is the one eval allowance,
           needed by ONNX Runtime to instantiate WASM (it does not grant JS eval).
         - worker-src: the engine worker is same-origin; blob: covers ONNX Runtime's
           pthread/proxy worker scripts.
         - style-src: React writes inline style attributes (theme colours). An attribute has
           no nonce/hash, so 'unsafe-inline' is limited to styles.
         - connect/img/media: 'self' plus the blob: URLs the engine uses for snapshots,
           clips and the local camera. No external origin is allowed anywhere, with one
           narrow exception: the optional network camera (`?whep=` / `localsight.whepUrl`)
           speaks WHEP to a MediaMTX gateway running on this machine, so loopback on any
           port is allowed for `connect-src`. That is still not "the internet": a WHEP URL
           on another host needs this policy widened deliberately, with TLS.
         - Vite's development preamble is injected at the top of <head>, before this meta,
           so the dev server's inline HMR preamble still runs; the production HTML has no
           inline script. The optional VITE_USE_MOCK=false API mode is outside this policy:
           connect-src is same-origin plus the operator's relay origin(s): a static app
           cannot know the relay host at runtime, so a remote relay needs the build-time
           VITE_WEBHOOK_ORIGIN allowlist (and localhost for the self-hosted relay). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: http://localhost:* http://127.0.0.1:* __WEBHOOK_ORIGIN__; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <!-- Best effort only: Chromium ignores Permissions-Policy in a meta tag (it is a
         response-header policy). It stays here so a host able to send the header has the
         intended value beside the app; a static Pages deploy cannot enforce it. -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=()" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Content attributes first, so the policy scope above is still what a reader checks. -->
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>LocalSight - Management condiții siguranță</title>
    <!-- Render-blocking on purpose: the theme is in place before the first paint, and the
         policy above disallows the inline version this replaced. -->
    <script src="/theme-init.js"></script>
  </head><body class="bg-white text-[#1F1F1F] dark:bg-[#1F1F1F] dark:text-[#F5F5F5] overflow-hidden">
    <!-- The mount point. React replaces its children, never the shell around it. -->
    <div id="root" data-mount="react"></div>
    <script src="/src/main.jsx" type="module"></script>
  </body></html>
